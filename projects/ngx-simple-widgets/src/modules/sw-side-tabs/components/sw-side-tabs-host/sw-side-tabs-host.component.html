<div class="sw-side-tabs-host flex">
	<div class="sw-side-tab-titles-host padding-2 flex flex-column align-items-center">
		<ng-container *ngFor="let sideTabTitleTemplate of swSideTabTitleTemplates; let tabIndex=index; trackBy: trackTitleTemplatesByIndex">
			<div 
				class="padding-1 sw-side-tab-title"
				[class.active]="activeTabIndex === tabIndex"
				(click)="onTabClick(tabIndex)"
			>
				<ng-container *ngTemplateOutlet="sideTabTitleTemplate"></ng-container>
			</div>
		</ng-container>
	</div>
	<div class="padding-3">
		<ng-container *ngTemplateOutlet="activeTabContentTemplate"></ng-container>
	</div>
</div>
