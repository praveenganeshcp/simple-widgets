<div class="flex flex-column form-control">
    <label 
        [for]="forId" 
        class="form-control-label padding-horizontal-1 small-font"
        *ngIf="label"
    >
        {{ label }}
    </label>
    <ng-content></ng-content>
    <span *ngIf="error" class="info-error small-font padding-top-1">
        {{ error }}
    </span>
</div>
