<div 
    class="sw-dropdown-input"
    (click)="isOpen = true"
    cdkOverlayOrigin 
    tabindex="0"
    #swDropdownPanelOrigin="cdkOverlayOrigin"
>
    <div class="flex align-items-center justify-space-between">
        <span 
            [class.sw-dropdown-placeholder]="!selectedValueVM"
        >
            {{ selectedValueVM ? selectedValueVM : placeholder }}
        </span>
        <sw-icon 
            [name]="isOpen ? 'expand_less' : 'expand_more'"
        >
        </sw-icon>
    </div>
</div>

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="swDropdownPanelOrigin"
    [cdkConnectedOverlayOpen]="isOpen"
    (backdropClick)="isOpen = false"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayBackdropClass]="'sw-dropdown-backdrop'"
>
    <div cdkListbox
        [cdkListboxValue]="selectedValues"
        (cdkListboxValueChange)="onValueChange($event)"
    >
        <ng-container *ngFor="let item of items">
            <div [cdkOption]="item.value">
                {{ item.key }}
            </div>
        </ng-container>
    </div>
</ng-template>
