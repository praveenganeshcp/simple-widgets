<div 
    class="sw-toast border-radius-1 padding-1 flex"
    [ngClass]="toastCssClass"
>
    <sw-icon [name]="iconName"></sw-icon>
    <div class="flex flex-column margin-left-1">
        <span class="padding-bottom-1" *ngIf="title">{{ title }}</span>
        <span>{{ message }}</span>
    </div>
</div>
