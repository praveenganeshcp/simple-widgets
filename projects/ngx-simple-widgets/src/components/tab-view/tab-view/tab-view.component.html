<div class="sw-tab-view" [class.sw-bottom-tab-view]="showTabsInBottom">
	<div class="sw-tab-view__titles" [class.bottom-tab-view-titles]="showTabsInBottom">
		<ng-container 
			*ngFor="let swTabTitleTemplate of swTabTitleTemplates; let tabIndex=index; trackBy: trackTitleTemplatesByIndex"
		>
			<div
				class="sw-tab-title"
				[class.sw-active-tab-title]="activeTabIndex === tabIndex"
				(click)="onTabClick(tabIndex)"
			>
				<ng-container *ngTemplateOutlet="swTabTitleTemplate"></ng-container>
			</div>
		</ng-container>
	</div>
	<div class="sw-tab-view__content">
		<ng-container *ngTemplateOutlet="activeTabContentTemplate"></ng-container>
	</div>
</div>
