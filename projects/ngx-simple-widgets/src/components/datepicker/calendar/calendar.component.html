<div class="sw-calendar-host">
    <div class="sw-month-calendar">
        <sw-month-calendar-header
            [year]="calendarState.getFullYear()"
            (moveNextMonth)="onMoveNextMonth()"
            (movePreviousMonth)="onMovePreviousMonth()"
            (moveNextYear)="onMoveNextYear()"
            (movePreviousYear)="onMovePreviousYear()"
        >
        </sw-month-calendar-header>
        <sw-month-calendar
            [selectedDate]="selectedDate"
            [month]="calendarState.getMonth()"
            [year]="calendarState.getFullYear()"
            (dateChange)="onDateChange($event)"
        ></sw-month-calendar>
    </div>
</div>
