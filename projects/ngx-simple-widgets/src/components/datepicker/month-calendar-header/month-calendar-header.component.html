<div class="sw-month-calendar-header">
  <div>
    <button (click)="onMovePreviousYear()" sw-icon-button size="sm">
      <sw-icon name="keyboard_double_arrow_left"></sw-icon>
    </button>
    <button (click)="onMovePreviousMonth()" sw-icon-button size="sm">
      <sw-icon name="keyboard_arrow_left"></sw-icon>
    </button>
  </div>

  <span>{{ year }}</span>

  <div>
    <button (click)="onMoveNextMonth()" sw-icon-button size="sm">
      <sw-icon name="keyboard_arrow_right"></sw-icon>
    </button>
    <button (click)="onMoveNextYear()" sw-icon-button size="sm">
      <sw-icon name="keyboard_double_arrow_right"></sw-icon>
    </button>
  </div>
</div>
