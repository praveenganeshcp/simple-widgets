
<div class="table-container">
  <table>
  <thead>
    <tr>
      <th
        *ngFor="let column of activeColumns; trackBy: trackByIndex"
      >
        {{ column.label }}
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of rows; trackBy: trackByIndex">
      <td
        *ngFor="let column of activeColumns; trackBy: trackByIndex"
      >
        <div class="cell-content" [ngClass]="{'shimmer': isLoading}">
          <ng-container
            *ngIf="
              column.renderTemplate && customCellTemplate;
              else defaultCellTemplate
            "
          >
            <ng-container
              [ngTemplateOutlet]="customCellTemplate"
              [ngTemplateOutletContext]="{
                row: row,
                column: column,
                value: row[column.fieldName]
              }"
            >
            </ng-container>
          </ng-container>
          <ng-template #defaultCellTemplate>
            {{ row[column.fieldName] }}
          </ng-template>
        </div>
      </td>
    </tr>
  </tbody>
</table>
</div>
