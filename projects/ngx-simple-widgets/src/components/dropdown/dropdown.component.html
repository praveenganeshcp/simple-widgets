<div 
    class="inline-flex align-items-center justify-space-between sw-dropdown-input" 
    cdkOverlayOrigin 
    tabindex="0"
    #swDropdownPanelOrigin="cdkOverlayOrigin"
>
    <input 
        sw-input 
        [size]="size" 
        (click)="isOpen = !isOpen"
        type="text" 
        [placeholder]="placeholder" 
        [value]="selectedValueVM" 
        (input)="onFilterOptions('')"
    />
    <sw-icon 
        class="sw-dropdown-toggle-icon"
        [name]="isOpen ? 'expand_less' : 'expand_more'"
    >
    </sw-icon>
</div>

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="swDropdownPanelOrigin"
    [cdkConnectedOverlayOpen]="isOpen"
    (backdropClick)="isOpen = false"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayBackdropClass]="'sw-dropdown-backdrop'"
>
    <div cdkListbox
        [cdkListboxValue]="selectedValues"
        class="sw-dropdown-panel"
        (cdkListboxValueChange)="onValueChange($event)"
    >
        <ng-container *ngFor="let option of filteredOptions; trackBy: trackDropdownOption">
            <div class="sw-dropdown-panel-option" [cdkOption]="option.value">
                {{ option.key }}
            </div>
        </ng-container>
    </div>
</ng-template>
