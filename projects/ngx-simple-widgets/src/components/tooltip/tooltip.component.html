<span 
    (mouseleave)="onMouseLeave()" 
    (mouseenter)="onMouseEnter()" 
    cdkOverlayOrigin 
    #swTooltipOrigin="cdkOverlayOrigin"
>
    <ng-content></ng-content>
</span>

<ng-template 
    cdkConnectedOverlay 
    [cdkConnectedOverlayOrigin]="swTooltipOrigin" 
    [cdkConnectedOverlayOpen]="showTooltip"
    [cdkConnectedOverlayPositions]="[connectedPositionStrategy]"
>
    <span 
        *ngIf="text" 
        class="sw-tooltip-text"
    >
        {{ text }}
    </span>
</ng-template>
